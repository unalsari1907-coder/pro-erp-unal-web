name: PRO ERP Web Paketini Ac

on:
  push:
    branches: [main]
    paths:
      - 'pro-erp-2.5.34-web.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Web paketini ac
        shell: bash
        run: |
          set -euo pipefail
          test -f pro-erp-2.5.34-web.zip
          rm -rf .unpack
          mkdir .unpack
          unzip -q pro-erp-2.5.34-web.zip -d .unpack
          test -f .unpack/index.html
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.unpack' ! -name 'README.md' -exec rm -rf {} +
          cp -a .unpack/. .
          rm -rf .unpack pro-erp-2.5.34-web.zip
          touch .nojekyll

      - name: Derlenmis ciktiyi commit et
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Degisiklik yok.'
          else
            git commit -m 'PRO ERP 2.5.34 derlenmis web yayini'
            git push origin main
          fi
