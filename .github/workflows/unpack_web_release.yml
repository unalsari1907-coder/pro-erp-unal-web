name: PRO ERP Web Yayinla

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Web dosyalarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f flutter.js
          test -f flutter_bootstrap.js
          test -f flutter_service_worker.js
          # Türkçeleşmiş dosya adlari varsa canonical adlara kopyala.
          if [ -f ana.dart.js ] && [ ! -f main.dart.js ]; then cp ana.dart.js main.dart.js; fi
          if [ -f stil.css ] && [ ! -f style.css ]; then cp stil.css style.css; fi
          if [ -f sürüm.json ] && [ ! -f version.json ]; then cp sürüm.json version.json; fi
          if [ -f _başlıklar ] && [ ! -f _headers ]; then cp _başlıklar _headers; fi
          if [ -f _yönlendirmeler ] && [ ! -f _redirects ]; then cp _yönlendirmeler _redirects; fi
          if [ -f uygulama.js ] && [ ! -f app.js ]; then cp uygulama.js app.js; fi
          test -f main.dart.js
          touch .nojekyll

      - name: Pages yapilandir
        uses: actions/configure-pages@v5

      - name: Pages artifact hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
