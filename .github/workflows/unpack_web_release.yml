name: PRO ERP Web Yayinla

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: PRO ERP 2.5.35 web dosyalarini dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.dart.js
          test -f flutter.js
          test -f flutter_bootstrap.js
          test -f flutter_service_worker.js
          test -f assets/AssetManifest.bin.json
          test -f canvaskit/canvaskit.wasm
          grep -q '<base href="/pro-erp-unal-web/">' index.html
          grep -q '"version":"2.5.35"' version.json

      - name: Pages yapilandir
        uses: actions/configure-pages@v5

      - name: Pages artifact hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
