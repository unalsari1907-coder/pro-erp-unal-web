<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/pro-erp-unal-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="PRO ERP - Dükkan Yönetimi">
  <meta name="theme-color" content="#1565C0">
  <meta name="robots" content="noindex,nofollow,noarchive">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRO ERP">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>PRO ERP</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    (() => {
      const resetVersion = "20260827-2";
      const resetKey = "pro-erp-cache-reset";

      const loadApp = () => {
        const script = document.createElement("script");
        script.src = "flutter_bootstrap.js?v=20260827-2";
        script.async = true;
        document.body.appendChild(script);
      };

      const bootstrap = async () => {
        if (localStorage.getItem(resetKey) !== resetVersion) {
          const hadController =
            "serviceWorker" in navigator && navigator.serviceWorker.controller;

          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations.map((registration) => registration.unregister()),
            );
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          localStorage.setItem(resetKey, resetVersion);

          if (hadController) {
            window.location.reload();
            return;
          }
        }

        loadApp();
      };

      bootstrap().catch(loadApp);
    })();
  </script>
</body>
</html>
